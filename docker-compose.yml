services:
  # 1. WEB SERVER
  web:
    image: php:8.2-apache
    container_name: apache2
    entrypoint:
      ["sh", "-c", "docker-php-ext-install mysqli pdo_mysql && apache2-foreground"]
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    networks:
      - xampp-network

  # 2. DATABASE SERVER
  db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "slemanclean_db"
    volumes:
      - xampp_db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - xampp-network

  # 3. PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
    networks:
      - xampp-network

networks:
  xampp-network:
    driver: bridge

volumes:
  xampp_db_data:
